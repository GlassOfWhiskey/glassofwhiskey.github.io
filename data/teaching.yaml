  mentorships:
    - year:        "2025/2026"
      role:        Supervisor
      kind:        "Bachelor's thesis"
      topic:       "Development of a CAPIO container connector"
      institution: "University of Turin"
      student:     "Marco Rossignoli"
      abstract: >-
        In High-Performance Computing (HPC), containerization platforms like Docker
        have not been as widely adopted as in other software sectors, primarily due to
        security and performance concerns. A common approach to mitigating I/O
        bottlenecks in containers is deploying specialized middleware libraries;
        however, most existing solutions require rewriting the application's source
        code. CAPIO bypasses this limitation by offering file- streaming capabilities
        through transparent injection into existing software. This thesis introduces
        a method to integrate CAPIO with existing Docker containers by developing a
        lightweight, two-component connector. Finally, a performance evaluation
        comparing native execution on the host against a containerized deployment shows
        that, while parallel execution faces localized synchronization bottlenecks at
        this scale, the automated connector itself adds negligible overhead, confirming
        its viability for containerized HPC workflows.
    - year:        "2025/2026"
      role:        Supervisor
      kind:        "Bachelor's thesis"
      topic:       "Implementation and Validation of the RISC-V Compressed Extension in the ARES Simulator"
      institution: "University of Turin"
      student:     "Valeria Cancarini"
      abstract: >-
        The gap between processor performance and memory latency makes code density
        a relevant factor in embedded systems, where program memory is often limited
        and may have high access times. In this context, the RISC-V Compressed
        extension, referred to as the C extension, introduces compact 16-bit encodings
        for many frequent 32-bit instructions, reducing executable size with changes
        concentrated mainly in the fetch and decode stages. This thesis presents the
        implementation of RISC-V Compressed support in the open-source ARES simulator,
        originally based on RV32IM. The work required extending the fetch, decode,
        execute, and disassembler modules. To analyze the dynamic effects of
        compression, a parametric instruction cache model was also integrated, with
        support for next-line prefetching. The experimental evaluation compares RV32IM
        and RV32IMC binaries using the Embench and DoomGeneric benchmarks. The results
        show that the C extension systematically reduces code size and can decrease
        instruction cache misses. However, the performance benefit depends on the actual
        behavior of the program. Improvements emerge especially in workloads with a large
        instruction working set, such as the DOOM engine logic considered without
        rendering. Conversely, many realistic workloads, particularly embedded ones,
        spend most of their time in hot loops that already reside in cache both with
        compressed and uncompressed code, limiting the impact on execution time. On the
        Embench benchmarks, RV32IMC reduces the .text section by between 20.10% and 32.21%.
        In the experimental model used, namely 1 cycle per instruction, a fully associative
        cache, and a miss penalty of 50 cycles, the average reduction in simulated clock
        cycles ranges from 6.16% to 32.57%, depending on the cache size. Furthermore, the
        minimum instruction cache capacity required to remain within 5% of the best observed
        result is reduced by up to 41.67%, with an average reduction of 19.01%.
    - year:        "2025/2026"
      role:        Co-supervisor
      kind:        "Bachelor's thesis"
      topic:       "Cloud-Oriented Workflow Scalability"
      institution: "University of Turin"
      student:     "Alessandro Laurato"
      abstract: >-
        This thesis addresses the challenge of workflow scalability in cloud-HPC
        environments, focusing on extending StreamFlow on Kubernetes. In
        particular, it examines the limitations of autoscaling policies based solely
        on infrastructure-level metrics and proposes a solution driven by
        application-level metrics that reflect the actual state of the workflow. By
        integrating KEDA, resource allocation becomes dynamic: workers are
        scaled according to the real workload, improving the overall efficiency of
        the system. Experimental results show that this approach significantly
        reduces execution time compared to sequential execution and, when
        compared to static maximum parallelism, lowers computational costs
        while maintaining strong performance.

    - year:        "2024/2025"
      role:        Supervisor
      kind:        "Bachelor's thesis"
      topic:       "Transparent user-space networking"
      institution: "University of Turin"
      student:     "Elsa Francesca Ionita"
      abstract: >-
        The development of network applications requires a thorough understanding
        of the interactions between processes and the underlying network stack.
        Modern frameworks such as DPDK and F-Stack provide tools for moving
        certain networking functionalities from kernel space to user space,
        enabling new approaches to implementing client-server communication.
        This work explores these possibilities through a combination of
        theoretical analysis and practical experimentation. First, DPDK and
        F-Stack were studied to gain an understanding of the principles behind
        network programming. Next, two processes—a server and a client—were
        developed in kernel space to examine socket-based communication
        mechanisms. Finally, the processes were migrated to user space within
        F-Stack, with targeted modifications introduced to ensure proper
        functionality and interaction between them. The study demonstrates how
        applications traditionally implemented in kernel space can be adapted to
        run in user space using F-Stack, while providing practical insights into
        the behavior and management of network processes in this environment.
        The results contribute to a broader understanding of user-space
        programming and offer practical guidance for developing applications
        that take advantage of its capabilities.

    - year:        "2024/2025"
      role:        Co-supervisor
      kind:        "Master's thesis"
      topic:       "Distributed workflows in Rust"
      institution: "University of Turin"
      student:     "Tommaso Foglio Bonda"
      abstract: >-
        This thesis presents the implementation of a Rust compilation target
        for SWIRL, an intermediate representation for distributed scientific
        workflows, and compares its performance with the original Python
        implementation. The work focuses on the execution of distributed
        workflows and shows how Rust's systems programming features can
        improve performance in specific distributed computing scenarios. The
        thesis also provides a detailed discussion of the architectural decisions
        behind the Rust target implementation. Two modules, “Orchestra” and
        “swirl-rs,” are introduced. They are used respectively for low-level
        communication and for integration with SWIRL-specific concepts.
        Extensive experiments conducted on HPC systems showed that the Rust
        implementation achieves roughly a 30% performance improvement over the
        existing Python version. Although this gain may appear modest at first
        glance, it does not account for additional advantages typically
        associated with compiled languages, such as a smaller memory footprint,
        lower runtime overhead, and reduced reliance on runtime dependencies.
        After identifying communication costs as a performance bottleneck, a
        broadcast communication protocol—available only in the Rust
        implementation—was introduced. This addition led to performance
        improvements of up to 400% for certain workflows. While these results
        are in line with expectations, even greater performance gains are
        anticipated at larger scales, where Rust's multithreading capabilities
        can be fully exploited.


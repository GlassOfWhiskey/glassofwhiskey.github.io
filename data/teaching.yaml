      topic:       "SNV Analysis Workflow in CWL, with hybrid deployment on HPC and local using StreamFlow"
      institution: "Università Campus Bio-Medico di Roma"
      student:     "Stefano Marangoni"

    - year:        "2023/2024"
      role:        Co-supervisor
      kind:        "Bachelor's thesis"
      topic:       "Human--machine interface for visualization, debugging, and editing of CWL workflows"
      institution: "University of Turin"
      student:     "Matteo Bleve"
      abstract: >-
        The aim of this thesis is to describe the development of the first version
        of an open-source web application called CWL-GUI, built using the React
        library and designed to visualize, create, and edit workflows written in
        Common Workflow Language (CWL). The application was developed in response
        to the need for open-source tools capable of making workflow management
        more intuitive and accessible through a graphical user interface. The use
        of React provides the project with a responsive, high-performance user
        interface. In addition, integration with CWL enables workflows to be
        defined in a standardized and interoperable way, facilitating their sharing
        across different systems. Finally, the open-source approach encourages
        adoption and continuous development through collaboration among developers
        and contributions from the community. This also creates opportunities for
        future extensions of the application’s functionality and the integration of
        new technologies.

    - year:        "2022/2023"
      role:        Co-supervisor
      kind:        "Master's thesis"
      topic:       "Trusted computation for the execution of distributed workflows"
      institution: "University of Turin"
      student:     "Lorenzo Brescia"
      abstract: >-
        The massive use of data for computations in various scientific fields
        has increasingly moved the focus toward protecting sensitive information.
        Although the adoption of Trusted Execution Environments (TEEs) has grown
        over time, there is still no method for automating trusted generic
        workflows within such environments. In general, the execution, of a
        distributed workflow in which multiple parties participate in the
        computation, requires setting the boundaries within which data has
        guaranteed confidentiality and integrity. This thesis aimed to investigate
        the design and implementation of a framework that allows a remote user to
        configure a generic workflow to execute all steps within TEEs established
        inside a remote host (e.g., a Cloud Service Provider). The relying party
        gains trust toward the remote TEE through remote attestation and by
        specifying a trust relationship with the hardware manufacturer that
        supplied the remote machines. Machines with state-of-the-art Trusted
        Computing hardware features, such as Intel Software Guard Extensions (SGX)
        processors, were used to aim the goal. Therefore, workflow steps are
        executed through Gramine, a Library Operating System (LibOS) that allows
        SGX to be integrated to run unmodified applications, making it possible to
        configure complex generic workflows.

    - year:        "2022/2023"
      role:        Co-supervisor
      kind:        "Master's thesis"
      topic:       "Porting the variant calling pipeline for NGS data in cloud-HPC environment"
      institution: "University of Turin"
      student:     "Alberto Mulone"
      abstract: >-
        In recent years, we have understood the importance of analyzing and
        sequencing human genetic variation. A relevant aspect that emerged from
        the Covid-19 pandemic was the need to obtain results very quickly; this
        involved using High-Performance Computing (HPC) environments to execute
        the Next Generation Sequencing (NGS) pipeline. However, HPC is not
        always the most suitable environment for the entire execution of a
        pipeline, especially when it involves many heterogeneous tools. The
        ability to execute parts of the pipeline on different environments can
        lead to higher performance but also cheaper executions.
        In this work, we show the design and optimization process that led us
        to a state-of-the-art Variant Calling hybrid workflow based on the
        StreamFlow Workflow Management System (WfMS). We also compare
        StreamFlow with Snakemake, an established WfMS targeting HPC
        facilities, observing comparable performance on single environments
        and satisfactory improvements with a hybrid cloud-HPC configuration.


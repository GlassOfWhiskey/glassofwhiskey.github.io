    - year:        "2023/2024"
      role:        Supervisor
      kind:        "Bachelor's thesis"
      topic:       "Syscall Intercept: RISC-V porting"
      institution: "University of Turin"
      student:     "Ottavio Monticelli"
      abstract: >-
        In recent years, RISC-V has been driving the Open Hardware revolution,
        with promising applications ranging from edge devices to HPC
        infrastructures. However, the software ecosystem has struggled to keep
        pace with the rapid adoption of RISC-V, leaving several libraries still
        unavailable for this architecture. This thesis presents a complete port
        of the syscall_intercept library, originally developed by Intel PMEM for
        x86_64, to the RISC-V 64 ISA. The library provides a low-level interface
        for intercepting Linux system calls in user space by hot-patching the libc
        machine code within a process's memory space. It serves as the low-level
        user-space interface for several HPC file systems, including MadFS, which
        achieved first place in the IO500 rankings in 2023. Because the core logic
        of syscall_intercept is implemented directly in assembly, the project also
        provides an excellent case study for examining the technical and
        methodological challenges involved in developing a high-performance port
        for RISC-V.

    - year:        "2023/2024"
      role:        Supervisor
      kind:        "Bachelor's thesis"
      topic:       "Human--machine interface for visualization, debugging, and editing of HPC workflows"
      institution: "University of Turin"
      student:     "Pierluigi Boscaglia"
      abstract: >-
        In recent years, in the field of High-Performance Computing (HPC),
        computational notebooks have proven highly valuable for workflow
        management, as they enable the integration of different execution
        environments within a single interface, thereby facilitating interactive
        analysis, monitoring, and task execution on distributed resources. Their
        purpose is to simplify and accelerate user interactions while minimizing
        errors that may arise during workflow organization, which—particularly due
        to recent advances in Deep Learning—has become increasingly complex to
        manage. This thesis contributes to the field of interactivity by extending
        the functionality of the web-based environment JupyterLab through the
        development of a frontend extension aimed at improving the usability of
        custom Jupyter Notebooks designed to manage and execute large-scale
        scientific applications.


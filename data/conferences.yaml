    - acronym: EuroHPC 2023
      location: Bruxelles, Belgium
      name: Cross-Facility Federated Learning
      author: Iacopo Colonnelli, Robert Birke, Giulio Malenza, Gianluca Mittone, Alberto
        Mulone, Marco Aldinucci, Valerio Basile, Marco Antonio Stranisci, Viviana
        Patti, Jeroen Galjaard, Lydia Y. Chen, Sanzio Bassini, Massimiliano Guarrasi,
        Gabriella Scipione, Jan Martinovič, Vit Vondrák
      url: https://datacloud.di.unito.it/index.php/s/DDAz4QkJP3WZ68M
    - location: Denver, CO, USA
      name: '2023 Workflows Community BoF: Modern Workflows for Continuum and Cross-Facility
        Computing'
    - acronym: WORKS 2023
      location: Denver, CO, USA
      name: A Systematic Mapping Study of Italian Research on Workflows
      author: Marco Aldinucci, Elena Baralis, Valeria Cardellini, Iacopo Colonnelli,
        Marco Danelutto, Sergio Decherchi, Giuseppe Di Modica, Luca Ferrucci, Marco
        Gribaudo, Francesco Iannone, Marco Lapegna, Doriana Medić, Giuseppa Muscianisi,
        Francesca Righetti, Eva Sciacca, Nicola Tonellotto, Mauro Tortonesi, Paolo
        Trunfio, Tullio Vardanega
      url: https://datacloud.di.unito.it/index.php/s/2kgooG43pGCykji
      abstract: >-
        An entire ecosystem of methodologies and tools revolves around scientific workflow management. They
        cover crucial non-functional requirements that standard workflow models fail to target, such as
        interactive execution, energy efficiency, performance portability, Big Data management, and
        intelligent orchestration in the Computing Continuum. Characterizing and monitoring this ecosystem
        is crucial to developing an informed view of current and future research directions. This work
        conducts a systematic mapping study of the Italian workflow research community, analyzing 25 tools
        and 10 applications from several scientific domains in the context of the “National Research Centre
        for HPC, Big Data, and Quantum Computing” (ICSC). The study aims to outline the main current
        research directions and determine how they address the critical needs of modern scientific
        applications. The findings highlight a variegated research ecosystem of tools, with a prominent
        interest in advanced workflow orchestration and still immature but promising efforts toward energy
        efficiency.
    - location: Pisa, Italy
      name: 2023 CINI HPC-KTT National Assembly
    - acronym: EAGE 2022
      location: Milan, Italy
      name: Hybrid Workflows For Large-Scale Scientific Applications
      author: Iacopo Colonnelli, Marco Aldinucci
      abstract: >-
        Large-scale scientific applications are facing an irreversible transition from monolithic, high-
        performance oriented codes to modular and polyglot deployments of specialised (micro-)services. The
        reasons behind this transition are many: coupling of standard solvers with Deep Learning techniques,
        offloading of data analysis and visualisation to Cloud, and the advent of specialised hardware
        accelerators. Topology-aware Workflow Management Systems (WMSs) play a crucial role. In particular,
        topology-awareness allows an explicit mapping of workflow steps onto heterogeneous locations,
        allowing automated executions on top of hybrid architectures (e.g., cloud+HPC or classical+quantum).
        Plus, topology-aware WMSs can offer non-functional requirements OOTB, e.g. components’ life-cycle
        orchestration, secure and efficient data transfers, fault tolerance, and cross-cluster execution of
        urgent workloads. Augmenting interactive Jupyter Notebooks with distributed workflow capabilities
        allows domain experts to prototype and scale applications using the same technological stack, while
        relying on a feature-rich and user-friendly web interface. This abstract will showcase how these
        general methodologies can be applied to a typical geoscience simulation pipeline based on the Full
        Wavefront Inversion (FWI) technique. In particular, a prototypical Jupyter Notebook will be executed
        interactively on Cloud. Preliminary data analyses and post-processing will be executed locally,
        while the computationally demanding optimisation loop will be scheduled on a remote HPC cluster.
      url: https://datacloud.di.unito.it/index.php/s/GScPS5LCPdt6Yoo
    - acronym: ITWSHPC 2022
      location: Torino, Italy
      name: Hybrid workflows for heterogeneous distributed computing
      author: Iacopo Colonnelli, Barbara Cantalupo, Doriana Medić, Marco Aldinucci
      url: https://datacloud.di.unito.it/index.php/s/ienbcA2DJ26aioE
    - location: Malaga, Spain
      name: J on The Beach 2022
    - location: Rome, Italy
      name: 'JupyterFlow: Jupyter Notebooks su larga scala'
      author: Iacopo Colonnelli, Sergio Rabellino
      abstract: >-
        I Jupyter Notebook sono largamente utilizzati sia in ambito industriale che accademico come
        strumento di didattica, prototipazione e analisi esplorative. Purtroppo il sistema runtime standard
        di Jupyter non è abbastanza potente per sostenere un carichi di lavoro reali e spesso l'unica
        soluzione è quella di riscrivere il codice da zero in una tecnologia con supporto HPC. Intrgrando lo
        stack Jupyter con StreamFlow (https://streamflow.di.unito.it/) è possibile creare i Notebook tramite
        un'interfaccia web su cloud ed eseguirli in maniera trasparente in remoto su una VM con GPU o su
        nodi HPC.
      url: https://datacloud.di.unito.it/index.php/s/ASPEmyXAj5QscgC
    - location: Rome, Italy
      name: Workshop GARR 2019
    - acronym: PDP 2019
      location: Pavia, Italy
      name: Deep Learning at Scale
      author: Iacopo Colonnelli
      abstract: >-
        This work presents a novel approach to distributed training of deep neural networks (DNNs) that aims
        to overcome the issues related to mainstream approaches to data parallel training. Established
        techniques for data parallel training are discussed from both a parallel computing and deep learning
        perspective, then a different approach is presented that is meant to allow DNN training to scale
        while retaining good convergence properties. Moreover, an experimental implementation is presented
        as well as some preliminary results.
      url: https://datacloud.di.unito.it/index.php/s/nRW9M69C3AtpDoM


    - year: 2022
      role: Invited speaker
      acronym: 2^nd^ HealthyCloud Workshop
      name: 'Dossier: multi-tenant distributed Jupyter Notebooks'
      location: Virtual event
      author: Iacopo Colonnelli, Dario Tranchitella
      abstract: >-
        When providing data analysis as a service, one must tackle several problems. Data privacy and
        protection by design are crucial when working on sensitive data. Performance and scalability are
        fundamental for compute-intensive workloads, e.g. training Deep Neural Networks. User-friendly
        interfaces and fast prototyping tools are essential to allow domain experts to experiment with new
        techniques. Portability and reproducibility are necessary to assess the actual value of results.
        Kubernetes is the best platform to provide reliable, elastic, and maintainable services. However,
        Kubernetes alone is not enough to achieve large-scale multi-tenant reproducible data analysis. OOTB
        support for multi-tenancy is too rough, with only two levels of segregation (i.e. the single
        namespace or the entire cluster). Offloading computation to off-cluster resources is non-trivial and
        requires the user's manual configuration. Also, Jupyter Notebooks per se cannot provide much
        scalability (they execute locally and sequentially) and reproducibility (users can run cells in any
        order and any number of times). The Dossier platform allows system administrators to manage multi-
        tenant distributed Jupyter Notebooks at the cluster level in the Kubernetes way, i.e. through CRDs.
        Namespaces are aggregated in Tenants, and all security and accountability aspects are managed at
        that level. Each Notebook spawns into a user-dedicated namespace, subject to all Tenant-level
        constraints. Users can rely on provisioned resources, either in-cluster worker nodes or external
        resources like HPC facilities. Plus, they can plug their computing nodes in a BYOD fashion.
        Notebooks are interpreted as distributed workflows, where each cell is a task that one can offload
        to a different location in charge of its execution.
      url: https://datacloud.di.unito.it/index.php/s/RNqTGmTqWS66qHT
    - year: 2021
      role: Invited speaker
      acronym: CWLCon 2021
      name: The Universal Cloud-HPC Pipeline for the AI-Assisted Explainable Diagnosis
        of COVID-19 Pneumonia
      location: Virtual event
      author: Marco Aldinucci, Iacopo Colonnelli
      abstract: >-
        We'll present a methodology to run DNN pipelines on hybrid cloud+HPC infrastructure. We'll also
        define a "universal pipeline" for medical images. The pipeline can reproduce all state-of-the-art
        DNNs to diagnose COVID-19 pneumonia, which appeared in the literature during the first Italian
        lockdown and following months. We can run all of them (across cloud+HPC platforms) and compare their
        performance in terms of sensitivity and specificity to set a baseline to evaluate future progress in
        the automated diagnosis of COVID-19. Also, the pipeline makes existing DNNs explainable by way of
        adversarial training. The pipeline is easily portable and can run across different infrastructures,
        adapting the performance-urgency trade-off. The methodology builds onto two novel software programs:
        the streamflow workflow system and the AI-sandbox concept (parallel container with user-space
        encrypted file system). We reach over 92% accuracy in diagnosing COVID pneumonia.
      url: https://datacloud.di.unito.it/index.php/s/AkQLbPpEEtDzbbm
    regular:
    - acronym: eScience 2025
      location: Chicago, IL, USA
      name: 'BookedSlurm: meeting user needs for advanced resource reservations in Slurm'
      author: Sandro Gepiro Contaldo, Lorenzo Bosio, Janneth Estefania Hoyos Rea,
        Elisa Li Perottino, Sergio Rabellino, Marco Aldinucci, Marco Beccuti, Iacopo
        Colonnelli
      abstract: >-
        Modern scientific discovery is frequently backed by large-scale scientific experiments, which cannot
        prescind from the unparalleled computational capabilities provided by high-performance computing
        systems. However, large data centers usually prioritize system efficiency over user accessibility,
        posing challenges for researchers without advanced computer science expertise. This work introduces
        BookedSlurm, a secure and user-focused extension of the Slurm workload manager, aiming to
        democratize HPC access across interdisciplinary research domains. BookedSlurm enables a partially
        decentralized regulation of fine-grained advanced resource reservations through a novel credit-based
        framework, ensuring fair and predictable access to computing resources. Its modular architecture
        leverages dedicated microservices to manage reservations, credit handling, and accounting. These
        components are exposed through a secure REST API and an intuitive web-based dashboard, enhancing
        system usability for novice and expert users. While the dashboard simplifies interactions for non-
        specialists, advanced users can directly access agent-level APIs for more complex and automated
        operations. The effectiveness of BookedSlurm is validated on a real-world bioinformatics use case
        from the SUS-MIRRI.IT project, showcasing its ability to enhance usability, optimize job scheduling,
        and streamline execution workflows.
      url: https://datacloud.di.unito.it/index.php/s/xT58tKdAjJDKy59

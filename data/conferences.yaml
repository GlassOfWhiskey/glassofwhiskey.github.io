    - year: 2023
      role: Invited speaker
      name: Standardised Workflows at EBRAINS
      location: Marseille, France
      author: Sofia Karvounari, Eleni Mathioulaki, Michael R. Crusoe, Iacopo Colonnelli
      abstract: >-
        A hands-on training offer for Standardised Workflows in EBRAINS. A short presentation will be used
        as an introduction, while the main hands-on session will provide information about Writing and
        Executing Standardised Workflows. TC will give some guidelines, so attendees can experiment with
        writing CWL tools and workflows and then they will be given access to VM to execute these workflows.
        The Workflows Dashboard will be also presented during the same session, offering to the attendees
        the opportunity to understand the different functionalities, use it with TC support and provide
        useful comments.
      url: https://datacloud.di.unito.it/index.php/s/K5YQKTsX9N7NLT8
    - year: 2023
      role: Invited speaker
      acronym: CWLCon 2023
      name: 'CWL for HPC: are we there yet?'
      location: EMBL, Heidelberg, Germany
      author: Iacopo Colonnelli
      abstract: >-
        Modern HPC applications are becoming so heterogeneous and complex that a modular approach to their
        design, deployment and orchestration is now necessary. This talk explores the benefits of using a
        vendor-agnostic workflow language (CWL) coupled with a hybrid workflow management system
        (StreamFlow) in the HPC ecosystem. Also, it will examine the requirements needed to model HPC
        applications effectively, the CWL’s readiness to meet such requirements, and the proposals made to
        improve the language where needed. Four real use cases will drive the discussion: the ACROSS Project
        (G.A. n. 955648), where CWL is the primary interface to model three HPC workflows, and the EUPEX
        Project (G.A. n. 101033975), where StreamFlow will be used for the rapid prototyping of a seismic
        engineering HPC application for a Modular Supercomputing Architecture (MSA) system.
      url: https://datacloud.di.unito.it/index.php/s/CMCd5LiZeXsxwEg
    - year: 2022

    - year: 2024
      role: Keynote speaker
      acronym: WSCC 2024
      name: Scientific Workflows in the Continuum Era
      location: Madrid, Spain
      author: Iacopo Colonnelli
      abstract: >-
        Thanks to their generality, workflow models represent a powerful abstraction for designing complex
        applications and executing them on large-scale distributed architectures. However, several
        additional challenges appear when transitioning from cloud/HPC environments to the entire compute
        continuum. Continuum execution environments are fully distributed and modular, and modules can be
        heterogeneous and independent of each other. In addition, continuum workflows often rely on multiple
        intercommunicating agents that form complex micro-services architectures. Different agents deal with
        different communication and parallelization paradigms: network-based stream processing at the edge
        and file-based batch processing on HPC facilities. Finally, support for efficient interactive
        workflows in the continuum remains an open research problem. This talk explores these challenges and
        provides insights on how to deal with them. A ready-to-use software library accompanies each
        proposed solution to facilitate the reproducibility and reusability of the presented concepts.
      url: https://datacloud.di.unito.it/index.php/s/PkqYA3p38XLKgrt

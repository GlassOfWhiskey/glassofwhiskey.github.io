  bio: >-
    Iacopo Colonnelli is an Assistant Professor in the Department of Computer
    Science at the University of Turin, Italy. He is a member of the HiPEAC
    community, a member of the CINI HPC-KTT National Laboratory, serves on the
    Technical Committee of the Common Workflow Language (CWL), and is a founding
    coordinator of the CWL4HPC working group. He earned his Ph.D. in Modeling and
    Data Science with honors from the University of Turin, where his thesis on
    novel workflow models for heterogeneous distributed systems received the
    ITADATA 2023 Best PhD Thesis Award. He has co-authored over 40 peer-reviewed
    publications in national and international journals and conferences, and has
    contributed to more than 10 funded research projects. He is currently the
    local Principal Investigator for the DARE European project (total budget:
    €240M). He is also the designer and maintainer of the StreamFlow workflow
    manager (120+ citations on Google Scholar as of May 2026, recognized as an
    emerging technology by the EC Innovation Radar initiative) and has developed
    several other frameworks and libraries for workflow management and
    high-performance computing. His research interests include workflow modeling
    and management in heterogeneous distributed architectures, high-performance
    computing and I/O, distributed confidential computing, and large-scale data
    science.
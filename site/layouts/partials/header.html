<header class="site-header">
  <input type="checkbox" id="nav-toggle" class="nav-toggle-input">
  <nav class="nav">
    <a class="nav-brand" href="/">{{ .Site.Title }}</a>
    <div class="nav-right">
      <ul class="nav-links">
        <li><a href="/" class="{{ if .IsHome }}active{{ end }}">Home</a></li>
        <li><a href="/about/" class="{{ if eq .Section "about" }}active{{ end }}">About</a></li>
        <li><a href="/publications/" class="{{ if eq .Section "publications" }}active{{ end }}">Publications</a></li>
        <li><a href="/talks/" class="{{ if eq .Section "talks" }}active{{ end }}">Talks</a></li>
        <li><a href="/software/" class="{{ if eq .Section "software" }}active{{ end }}">Software</a></li>
        <li><a href="/activities/" class="{{ if eq .Section "activities" }}active{{ end }}">Activities</a></li>
        <li><a href="/teaching/" class="{{ if eq .Section "teaching" }}active{{ end }}">Teaching</a></li>
      </ul>
      <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle navigation menu">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        <svg class="nav-toggle-close" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </label>
      <label for="dark-mode" class="theme-toggle-btn" aria-label="Toggle dark/light mode">
        {{- /* Moon: shown in light mode — click to go dark */ -}}
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
        {{- /* Sun: shown in dark mode — click to go light */ -}}
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </label>
    </div>
  </nav>
</header>

name: CI Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hugo (extended)
        env:
          HUGO_VERSION: "0.160.1"
        run: |
          wget -q "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz" hugo
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - name: Install Pandoc
        run: sudo apt-get install -y pandoc

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python dependencies
        run: uv sync

      - name: Cache TinyTeX
        id: cache-tinytex
        uses: actions/cache@v5
        with:
          path: ~/.TinyTeX
          key: tinytex-${{ runner.os }}-v1-${{ hashFiles('pandoc/templates/moderncv.latex') }}
          restore-keys: |
            tinytex-${{ runner.os }}-v1-

      - name: Install TinyTeX
        if: steps.cache-tinytex.outputs.cache-hit != 'true'
        run: |
          wget -qO- "https://yihui.org/tinytex/install-bin-unix.sh" | sh
          echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"
          "$HOME/.TinyTeX/bin/x86_64-linux/tlmgr" install \
            moderncv eurosym geometry \
            fontawesome5 microtype xcolor \
            url hyperref etoolbox xpatch \
            lm tools collection-fontsrecommended \
            pgf biblatex biblatex-ieee biber.x86_64-linux

      - name: Add TinyTeX to PATH (cache hit)
        if: steps.cache-tinytex.outputs.cache-hit == 'true'
        run: echo "$HOME/.TinyTeX/bin/x86_64-linux" >> "$GITHUB_PATH"

      - name: Generate cv.yaml
        run: make cv.yaml

      - name: Build CV PDF
        run: make cv

      - name: Build Publications PDF
        run: make publications

      - name: Build CV with Publications PDF
        run: make cv-with-publications

      - name: Copy CV to site
        run: cp cv.pdf site/static/cv.pdf

      - name: Generate publications data
        run: uv run python scripts/bib_to_yaml.py publications.bib site/data/publications.yaml

      - name: Copy CV data for Hugo
        run: cp cv.yaml site/data/cv.yaml

      - name: Build Hugo site
        run: hugo --source site --minify

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-public
          path: site/public
